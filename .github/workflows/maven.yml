on:
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: GraalVM 25
    steps:
      - uses: actions/checkout@v6
      - uses: graalvm/setup-graalvm@v1
        with:
          version: 'latest'
          java-version: '25'
          cache: maven

      - name: build
        run: |
          mvn -B package -Pnative

      - name: Upload Java Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazylr.jar
          path: target/lazylr-*.jar
          overwrite: true

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazylr
          path: target/lazylr
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lazylr/lazylr.jar
            lazylr/lazylr
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true