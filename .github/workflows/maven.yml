on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: GraalVM 25
    steps:
      - uses: actions/checkout@v6
      - uses: graalvm/setup-graalvm@v1
        with:
          version: 'latest'
          java-version: '25'
          cache: maven

      - name: build
        run: |
          mvn -B package -Pnative

